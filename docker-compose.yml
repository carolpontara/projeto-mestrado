services:
  api:
    build:
      context: .
      args:
        SPACY_MODEL: ${SPACY_MODEL:-pt_core_news_sm}
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    env_file:
      - path: .env
        required: false
    environment:
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - API_KEY_LLM=${API_KEY_LLM:-}
    restart: unless-stopped

  streamlit:
    build:
      context: .
    command: >
      streamlit run app_streamlit.py
      --server.port=${STREAMLIT_PORT:-8501}
      --server.address=0.0.0.0
    ports:
      - "${STREAMLIT_PORT:-8501}:${STREAMLIT_PORT:-8501}"
    env_file:
      - path: .env
        required: false
    environment:
      - API_URL=${API_URL:-http://api:8000/analyze}
    depends_on:
      - api
    restart: unless-stopped
